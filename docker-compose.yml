services:

  app:
    build: .

    container_name: campaign-notification-service

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - mongo

    restart: unless-stopped

  mongo:
    image: mongo:7

    container_name: notification-mongo

    ports:
      - "27018:27017"

    volumes:
      - mongo_data:/data/db

    restart: unless-stopped

volumes:
  mongo_data: